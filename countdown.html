<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico" />
    <meta name="theme-color" content="#CC0102" />
    <meta name="description" content="President" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/styles.min.css" />
    <title>President</title>
  </head>

  <body class="body">
    <!--PRELOADER-->
    <div class="preloader" data-preloader>
      <span>
        <img src="./assets/img/svg/logo.svg" alt="President" />
      </span>
    </div>

    <main class="main">
      <!--HERO-->
      <section class="section section--countdown">
        <h1 class="title title--h1 gold">Вкус как <br />искусство</h1>

        <video src="./assets/img/main_animation.webm" autoplay muted loop playsinline class="president"></video>

        <div class="main-prize center">
          <img src="./assets/img/prizes/main.webp" alt="President" />
        </div>

        <div class="main-prize">
          <h2 class="title title--h3 gold">До старта акции</h2>

          <ul class="countdown" data-countdown>
            <li>
              <p>дни</p>
              <b data-days class="gold">22</b>
            </li>
            <li>
              <p>часы</p>
              <b data-hours class="gold">8</b>
            </li>
            <li>
              <p>минуты</p>
              <b data-minutes class="gold">22</b>
            </li>
            <!-- <li>
              <p>сукунды</p>
              <b data-seconds class="gold">22</b>
            </li> -->
          </ul>
        </div>
      </section>
    </main>

    <script src="./assets/js/scripts.js" type="module"></script>
  </body>
</html>
